name: Idea or new template
description: Suggest a new topic, template, calculator feature or tool integration.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What SRE task should the skill handle better?
      description: Describe the situation, e.g. "writing Datadog monitors from SLOs".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you add?
      description: A template, a section in SKILL.md, a calculator command, an eval case...
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Chapter citations, openly licensed docs, or your own experience. Please don't paste text from the SRE books.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to send a pull request for this.
