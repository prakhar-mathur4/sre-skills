apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-worker }
  template:
    metadata:
      labels: { app: order-worker }
    spec:
      containers:
        - name: worker
          image: registry.example.com/order-worker:1.7.2
          env:
            - { name: QUEUE_URL, value: order-events }
            - { name: ORDERS_DB_HOST, value: orders-prod.internal }
            - { name: EMAIL_PROVIDER_URL, value: https://api.mail.example }
