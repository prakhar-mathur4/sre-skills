groups:
  - name: shop
    rules:
      - alert: HighCPU
        expr: avg(rate(container_cpu_usage_seconds_total{namespace="shop"}[5m])) > 0.8
        for: 5m
        labels: { severity: page }
      - alert: PodRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="shop"}[15m]) > 0
        labels: { severity: page }
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.1
        for: 10m
        labels: { severity: warning }
