schema_version: "1.1"
name: cert-expiry-alert-went-to-wrong-channel
expected_outcome: |
  Response makes mitigation its main plan: gets a valid certificate onto every affected endpoint (both load balancers, app and api hostnames), or gets a valid certificate from any trusted CA (for example an emergency purchase from the commercial CA, or an issuance from the new provider with a fallback), without making root-cause analysis a prerequisite (declaring the incident, a time-boxed check of the paging path and read-only pre-checks may run first or in parallel). It verifies from outside the network (full chain, SAN list, each hostname, new expiry date), flags that domain validation for the first cert from the new provider can take time so a fallback is needed, and marks load balancer changes as risky with blast radius and rollback. It also finds the two monitoring failures: the 30-day expiry alert had no owner and no paging path, and nothing from monitoring has reached the pager since 1 July (the alert path itself is dead and unmonitored, an urgent separate finding). It proposes a dead man's switch / heartbeat, tiered expiry alerts with an acknowledged page (for example ticket at 30 days, business-hours page at 14, page at 7), automated renewal, and a blameless postmortem that does not blame whoever renewed the certificate by hand.
context:
  scaffold_script: place-files.sh
