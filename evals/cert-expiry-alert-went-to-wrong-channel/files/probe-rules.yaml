groups:
- name: external-probes
  rules:
  - alert: EndpointDown
    expr: probe_success{job="blackbox-https"} == 0
    for: 3m
    labels: {severity: page}
    annotations:
      summary: "{{ $labels.instance }} failed its HTTPS probe"
  - alert: SlowEndpoint
    expr: probe_duration_seconds{job="blackbox-https"} > 2
    for: 10m
    labels: {severity: ticket}
  - alert: CertExpiringSoon
    expr: (probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time()) / 86400 < 30
    labels: {severity: notify, route: chat-infra-alerts}
    annotations:
      summary: "Certificate for {{ $labels.instance }} expires in under 30 days"
